name: Build bootstrap

on:
  workflow_dispatch:
    inputs:
      app_package:
        description: "Android applicationId/package name"
        required: false
        default: "com.termux"
      arch:
        description: "Architecture to build"
        required: false
        default: "aarch64"
      android10:
        description: "Build Android 10+ bootstrap"
        required: false
        type: boolean
        default: true
      include_extra_packages:
        description: "Include extra packages from scripts/packages.txt"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Disk space (before)
        run: |
          set -euo pipefail
          df -h

      - name: Free disk space (lightweight)
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          df -h

      - name: Move Docker data-root to /mnt/docker
        run: |
          set -euo pipefail
          DOCKER_ROOT="/mnt/docker"
          sudo systemctl stop docker
          sudo mkdir -p "$DOCKER_ROOT"
          if [ -d /var/lib/docker ] && [ -n "$(ls -A /var/lib/docker 2>/dev/null || true)" ]; then
            sudo rsync -aHAX --delete /var/lib/docker/ "$DOCKER_ROOT/" || true
          fi
          echo "{\"data-root\": \"$DOCKER_ROOT\"}" | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | sed -n '1,120p'
          df -h

      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare build log
        run: |
          set -euo pipefail
          mkdir -p logs
          LOG_PATH="logs/bootstrap-${{ inputs.arch }}-${{ github.run_id }}.log"
          : > "$LOG_PATH"
          echo "BOOTSTRAP_LOG=$LOG_PATH" >> "$GITHUB_ENV"
          echo "Bootstrap build log: $LOG_PATH"

      - name: Build bootstrap zip
        run: |
          set -euo pipefail

          args=(
            --app-package "${{ inputs.app_package }}"
            --arch "${{ inputs.arch }}"
          )

          if [ "${{ inputs.include_extra_packages }}" = "true" ]; then
            args+=(--packages-file scripts/packages.txt)
          fi

          if [ "${{ inputs.android10 }}" != "true" ]; then
            args+=(--no-android10)
          fi

          cmd=(./build-bootstrap.sh "${args[@]}")
          cmd_str="$(printf '%q ' "${cmd[@]}")"

          # Use a pseudo-TTY to reduce stdout buffering and write a full log to an artifact.
          # GitHub Actions UI truncates logs (~50k lines), but the artifact will contain everything.
          script -q -e -f -c "$cmd_str" "$BOOTSTRAP_LOG"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-log-${{ inputs.arch }}-${{ github.run_id }}
          path: logs/bootstrap-${{ inputs.arch }}-${{ github.run_id }}.log
          if-no-files-found: warn

      - name: List produced zips
        run: |
          set -euo pipefail
          ls -lah ./*.zip

      - name: Upload bootstrap zip
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ inputs.arch }}-${{ github.sha }}
          path: bootstrap-*.zip
          if-no-files-found: error

      - name: Docker cleanup (always)
        if: always()
        run: |
          set -euo pipefail
          docker system prune -af --volumes || true
          df -h
          